# A release: pushing a tag like v0.3.0 packs the mod into a zip and publishes it, and Obsidian offers
# it as an update to anyone on an older version.
#
# The rules for a release:
# - The tag matches "version" in obsidian.json.
# - CHANGELOG.md has a section headed "## <version>": a list with one change per line, each starting
#   "New:", "Changed:" or "Removed:", and nothing else. It becomes the release text on GitHub.
# - The changelog follows the rules for public text: plain wording, and no em or en dashes.
#
# A tag with a suffix (v0.3.0-beta.1) makes a prerelease, which Obsidian doesn't offer, so use one to
# try a build by hand. What goes in the zip is set by export-ignore in .gitattributes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches obsidian.json, and the changelog has a section for it
        run: |
          v="${GITHUB_REF_NAME#v}"
          have=$(jq -r .version obsidian.json)
          [ "$have" = "$v" ] || { echo "::error::obsidian.json says $have, the tag says $GITHUB_REF_NAME"; exit 1; }
          awk -v head="## $v" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          grep -q . "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section headed ## $v"; exit 1; }
          python3 -c "
          import re, sys
          bad = [l for l in open(sys.argv[1], encoding='utf-8').read().splitlines()
                 if l.strip() and (not re.match(r'- (New|Changed|Removed): ', l) or re.search('[–—]', l))]
          for l in bad: print('::error::changelog line breaks the rules:', l)
          sys.exit(1 if bad else 0)
          " "$RUNNER_TEMP/notes.md"

      - name: Tests
        run: |
          sudo apt-get install -y -qq luajit >/dev/null
          luajit tests/run.lua

      - name: Pack and publish
        run: |
          id=$(jq -r .id obsidian.json)
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="$id/" -o "$id-$version.zip" "$GITHUB_SHA"
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$id-$version.zip" --title "$(jq -r .name.en obsidian.json) $version" \
            --notes-file "$RUNNER_TEMP/notes.md" $pre
